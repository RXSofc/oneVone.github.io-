<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>void.chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Cormorant+Garamond:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <div id="modal-overlay">
    <div id="modal">
      <div class="modal-icon">V</div>
      <h2>void.chat</h2>
      <p>pilih nama buat masuk.<br>no account, no trace.</p>
      <input id="username-input" type="text" placeholder="username lo..." maxlength="24" autocomplete="off" spellcheck="false">
      <div id="modal-error"></div>
      <button id="enter-btn">masuk ke room →</button>
    </div>
  </div>

  
  <div id="shell">

    
    <div id="header">
      <button class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg>
      </button>
      <div id="header-mid">
        <div class="room-avatar">V</div>
        <div>
          <div class="room-name">void.chat</div>
          <div class="room-status">
            <div class="dot-live"></div>
            <span id="online-count">0</span>&nbsp;online
          </div>
        </div>
      </div>
      <button class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>
      <button class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
      </button>
    </div>

    
    <div id="messages">
      <div id="scroll-anchor"></div>
    </div>

    <div id="typing-row">
      <div class="typing-avatar">···</div>
      <div class="typing-bubble">
        <div class="d"></div><div class="d"></div><div class="d"></div>
      </div>
      <span id="typing-label"></span>
    </div>

    <!-- TOOLBAR -->
    <div id="toolbar">
      <div id="input-row">
        <input id="msg-input" type="text" placeholder="ketik pesan..." maxlength="500" autocomplete="off" spellcheck="false" disabled>
        <button id="send-btn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2" fill="#ffffff" stroke="none"/>
          </svg>
        </button>
      </div>
      <div id="icon-row">
        <div class="bottom-icons">
          <button class="bottom-icon-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </button>
          <button class="bottom-icon-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </button>
          <button class="bottom-icon-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
        </div>
        <span id="you-tag">—</span>
        <div class="bottom-icons">
          <button class="bottom-icon-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
          <button class="bottom-icon-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <!-- App logic -->
  <script src="app.js"></script>

</body>
</html>
